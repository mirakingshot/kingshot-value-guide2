<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Mira’s KS Value Guide</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<div class="card"><div class="card-head"><div><h2>Special event pack valuations</h2><p>Jump straight to the valuation for a limited-time pack.</p></div></div><div class="big-links" id="featured"></div></div>
<div class="card"><div class="card-head"><div><h2>Explore the guide</h2><p>Everything is priced from what regular packs charge.</p></div></div><div class="big-links" id="explore"></div></div>
<div id="board"></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
header("index.html");
Promise.all([unitValues(), get("shops"), get("popups"), get("featured").catch(() => ({ featured: [] }))])
.then(([m, { shops }, { popups }, { featured }]) => {
  const packs = scorePacks(m, popups).filter(p => !p.event);
  stats([
    ["Items valued", Object.keys(m).length, "list", ""],
    ["Event shops", shops.filter(s => !s.event).length, "bag", "pink"],
    ["Pop-up packs", packs.length, "gift", "peach"],
    ["Best pop-up ratio", packs.length ? Math.max(...packs.map(r => r.ratio)).toFixed(2) + "x" : "none yet", "bars", ""]
  ]);
  document.getElementById("featured").innerHTML = featured.length
    ? featured.map(f => bigLink(f.url || "popups.html", "gift", f.title, f.description, f.badge)).join("")
    : `<p class="dim">No featured packs yet. Add a row to the featured tab of your sheet.</p>`;
  document.getElementById("explore").innerHTML = [
    ["event.html", "star", "Special events", "Holiday events with their currency shop and packs."],
    ["shops.html", "bag", "Event shops", "What each shop token is worth."],
    ["popups.html", "gift", "Pop-up packs", "Every special pack versus regular prices."],
    ["build.html", "calc", "Pack builder", "Check any pack by typing in its items and price."],
    ["masterlist.html", "list", "Masterlist", "The dollar value of every upgrade item."]
  ].map(l => bigLink(...l)).join("");
  if (!packs.length) {
    document.getElementById("board").innerHTML = `<div class="card"><h2>Pop-up pack scoreboard</h2><p class="dim">No general pop-up packs yet. Holiday event packs are on the <a href="event.html">Special events</a> page.</p></div>`;
    return;
  }
  render(document.getElementById("board"), [
    { key: "name", label: "Pack", text: r => r.name },
    { key: "price", label: "Price", text: r => fmt(r.price, 2) },
    { key: "ratio", label: "Ratio", text: r => `<span class="strong">${r.ratio.toFixed(2)}x</span>` },
    { key: "v", label: "Verdict", sort: r => r.ratio, text: r => { const [t, c] = verdict(r); return `<span class="pill ${c}">${t}</span>`; } }
  ], packs, false, ["Pop-up pack scoreboard", "Best value first. Click a pack to see what is inside."], ["ratio", -1], packDetail);
});
</script></body></html>
