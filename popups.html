<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pop-up packs - Kingshot Value Guide</title><link rel="stylesheet" href="style.css"></head>
<body><main><div id="t"></div>
<p class="note">Pack worth = what the same contents cost at regular pack rates. Ratio above 1.00x means better than regular packs. Great is 1.25x or more, fair is 0.90x to 1.25x, poor is under 0.90x. If an item has no pack price, it is left out and the row is marked partial, so the real ratio is higher.</p></main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
header("popups.html");
Promise.all([unitValues(), get("popups")]).then(([m, { popups }]) => {
  const rows = popups.map(p => {
    let worth = 0, missing = [];
    p.contents.forEach(c => (m[c.item] ? (worth += m[c.item].unit * c.qty) : missing.push(c.item)));
    const ratio = worth / p.price;
    return { name: p.name, sample: p.sample, price: p.price, worth, ratio, missing };
  });
  const verdict = r => r.ratio >= 1.25 ? ["Great", "good"] : r.ratio >= 0.9 ? ["Fair", ""] : ["Poor", "bad"];
  render(document.getElementById("t"), [
    { key: "name", label: "Pack", text: r => r.name + (r.sample ? '<span class="tag">sample</span>' : "") },
    { key: "price", label: "Price", text: r => fmt(r.price, 2) },
    { key: "worth", label: "Worth at pack rates", text: r => fmt(r.worth, 2) + (r.missing.length ? ` <span class="dim" title="Unpriced: ${r.missing.join(", ")}">(partial)</span>` : "") },
    { key: "ratio", label: "Ratio", text: r => r.ratio.toFixed(2) + "x" },
    { key: "v", label: "Verdict", sort: r => r.ratio, text: r => { const [t, c] = verdict(r); return `<span class="${c}">${t}</span>`; } }
  ], rows, false);
});
</script></body></html>
