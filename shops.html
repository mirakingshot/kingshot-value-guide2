<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event shops - Kingshot Value Guide</title><link rel="stylesheet" href="style.css"></head>
<body><main><div id="shops"></div>
<p class="note">Token value is the best $ per token in the shop, since that is what a token is worth if spent well. "% of best" compares every item to it. Items with no pack price are unpriced. Assumes 1 unit per purchase.</p></main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
header("shops.html");
Promise.all([unitValues(), get("shops")]).then(([m, { shops }]) => {
  const root = document.getElementById("shops");
  shops.forEach((s, i) => {
    const rows = s.items.map(x => {
      const u = m[x.item] ? m[x.item].unit : null;
      return { item: x.item, tokens: x.tokens, unit: u, perToken: u == null ? null : u / x.tokens };
    });
    const best = Math.max(...rows.map(r => r.perToken || 0));
    rows.forEach(r => (r.pct = r.perToken == null ? null : r.perToken / best));
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>${s.name}</h2><p class="sub">1 token is worth about <strong>${fmt(best, 6)}</strong>. 1,000 tokens ≈ ${fmt(best * 1000, 2)}.</p><div></div>`;
    root.appendChild(sec);
    render(sec.querySelector("div"), [
      { key: "item", label: "Item", text: r => r.item },
      { key: "tokens", label: "Tokens", text: r => r.tokens.toLocaleString() },
      { key: "unit", label: "$ each", text: r => fmt(r.unit) },
      { key: "perToken", label: "$ per token", text: r => fmt(r.perToken, 6) },
      { key: "pct", label: "% of best", text: r => r.pct == null ? `<span class="dim">unpriced</span>` : Math.round(r.pct * 100) + "%<span class=meter style=\"width:" + Math.round(r.pct * 60) + "px\"></span>" }
    ], rows, false);
  });
});
</script></body></html>
